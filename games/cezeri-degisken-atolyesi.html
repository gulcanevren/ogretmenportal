<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cezeri’nin Değişken Atölyesi</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--tx:#1d2433;--mu:#5d6679;--ac:#d9480f;--ok:#2b8a3e;--no:#c92a2a;--bd:#ddd8ca;--code:#1e2433;--codetx:#ffd8a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e2330;--tx:#eceff6;--mu:#9aa3b8;--ac:#ff922b;--ok:#69db7c;--no:#ff8787;--bd:#333a4d;--code:#0c0e14;--codetx:#ffd8a8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.score{font-weight:700;color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:6px;margin:10px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .4s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:1.15rem}
.mu{color:var(--mu);font-size:.92rem}
pre,.code{background:var(--code);color:var(--codetx);border-radius:10px;padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:1rem;overflow-x:auto;margin:10px 0;white-space:pre}
button{font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;min-height:44px}
button:hover:not(:disabled){border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
button:disabled{opacity:.45;cursor:default}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opts button.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.fb{margin-top:10px;padding:10px;border-radius:10px;font-size:.95rem}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.fb.no{background:color-mix(in srgb,var(--no) 15%,var(--card))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:9px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);min-height:44px;min-width:0}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.box{border:3px dashed var(--bd);border-radius:12px;padding:10px;text-align:center;min-height:96px}
.box.full{border-style:solid;border-color:var(--ac)}
.box b{display:block;font-family:ui-monospace,Consolas,monospace;color:var(--ac)}
.box .v{font-size:1.4rem;font-weight:700;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--bd);border-radius:20px;padding:0 8px;color:var(--mu)}
.big{text-align:center;font-size:3rem;margin:8px 0}
.log{font-size:.85rem}
</style>
</head>
<body>
<main>
<div class="top"><h1>⚙️ Cezeri’nin Değişken Atölyesi</h1><div class="score" id="score">Puan: 0</div></div>
<div class="bar"><i id="prog"></i></div>
<div id="app"></div>
</main>
<script>
var stage=0,score=0,streak=0,qi=0,vars={};
var app=document.getElementById("app");
var stages=[
{t:"Kutuları Tanı",type:"lab"},
{t:"Veri Türü Avı",type:"quiz",intro:"Değişkenin içindeki değerin bir türü vardır: int (tam sayı), float (ondalıklı sayı), str (metin), bool (True/False). Değere bakıp türünü bul!",
q:[
{c:"yas = 25",p:"25 hangi türde?",o:["int","float","str","bool"],a:0,e:"Ondalık kısmı olmayan sayı → int (tam sayı)."},
{c:"pi = 3.14",p:"3.14 hangi türde?",o:["int","float","str","bool"],a:1,e:"Nokta ile yazılan ondalıklı sayı → float."},
{c:"ad = \"Merhaba\"",p:"\"Merhaba\" hangi türde?",o:["int","float","str","bool"],a:2,e:"Tırnak içindeki her şey metindir → str."},
{c:"kapi_acik = True",p:"True hangi türde?",o:["int","float","str","bool"],a:3,e:"Sadece True veya False olabilir → bool (mantıksal)."},
{c:"numara = \"25\"",p:"\"25\" hangi türde?",o:["int","float","str","bool"],a:2,e:"Tırnak içinde olduğu için sayı değil metindir → str. Tırnak türü değiştirir!"},
{c:"boy = 1.75",p:"1.75 hangi türde?",o:["int","float","str","bool"],a:1,e:"Ondalıklı → float."},
{c:"yanlis = False",p:"False hangi türde?",o:["int","float","str","bool"],a:3,e:"False de bool türündedir."},
{c:"sicaklik = -7",p:"-7 hangi türde?",o:["int","float","str","bool"],a:0,e:"Negatif de olsa ondalığı yoksa int."}]},
{t:"İsim Kontrolü",type:"quiz",intro:"Değişken adı; harf veya _ ile başlar, boşluk ve tire içermez, Python’un ayrılmış sözcüğü (class, if, for...) olamaz. Büyük/küçük harf farklıdır.",
q:[
{c:"yas",p:"Bu ad geçerli mi?",o:["Geçerli","Geçersiz"],a:0,e:"Harfle başlıyor, özel karakter yok."},
{c:"2sinif",p:"Bu ad geçerli mi?",o:["Geçerli","Geçersiz"],a:1,e:"Rakamla başlayamaz. sinif2 olurdu."},
{c:"ogrenci_adi",p:"Bu ad geçerli mi?",o:["Geçerli","Geçersiz"],a:0,e:"Alt çizgi (_) kullanılabilir; kelimeleri ayırmanın yoludur."},
{c:"ogrenci adi",p:"Bu ad geçerli mi?",o:["Geçerli","Geçersiz"],a:1,e:"Boşluk olamaz. ogrenci_adi yazılmalı."},
{c:"toplam-puan",p:"Bu ad geçerli mi?",o:["Geçerli","Geçersiz"],a:1,e:"Tire, çıkarma işareti sayılır. toplam_puan yazılmalı."},
{c:"class",p:"Bu ad geçerli mi?",o:["Geçerli","Geçersiz"],a:1,e:"class Python’da ayrılmış sözcüktür, ad olarak kullanılamaz."},
{c:"_gizli",p:"Bu ad geçerli mi?",o:["Geçerli","Geçersiz"],a:0,e:"Alt çizgiyle başlayabilir."},
{c:"yas = 10\nYas = 20",p:"yas ve Yas aynı değişken mi?",o:["Evet, aynı","Hayır, farklı"],a:1,e:"Python büyük/küçük harfe duyarlıdır: iki ayrı kutu!"}]},
{t:"Çıktıyı Tahmin Et",type:"quiz",intro:"Yorumlayıcı kodu satır satır çalıştırır (Python gibi). Sen de satır satır izle: print() ne yazdıracak?",
q:[
{c:"x = 5\nx = 8\nprint(x)",p:"Çıktı ne olur?",o:["5","8","13","Hata"],a:1,e:"Kutuya yeni değer girince eskisi silinir. Son değer 8."},
{c:"a = 10\nb = a\na = 20\nprint(b)",p:"Çıktı ne olur?",o:["10","20","30","Hata"],a:0,e:"b = a anında a’nın değeri (10) b’ye kopyalanır. Sonra a değişse de b değişmez."},
{c:"ad = \"Ali\"\nprint(\"Merhaba\", ad)",p:"Çıktı ne olur?",o:["Merhaba ad","Merhaba Ali","Ali Merhaba","Hata"],a:1,e:"Tırnaksız ad, değişkenin içindeki değeri getirir."},
{c:"sayi = 4\nsayi = sayi + 3\nprint(sayi)",p:"Çıktı ne olur?",o:["4","3","7","sayi + 3"],a:2,e:"Önce sağ taraf hesaplanır (4+3=7), sonra kutuya yazılır."},
{c:"a = \"5\"\nb = \"3\"\nprint(a + b)",p:"Çıktı ne olur?",o:["8","53","a + b","Hata"],a:1,e:"Metinler toplanınca yan yana eklenir: \"5\" + \"3\" = 53."},
{c:"print(type(3.0))",p:"Çıktı ne olur?",o:["<class 'int'>","<class 'float'>","<class 'str'>","<class 'bool'>"],a:1,e:"3.0 ondalık nokta içerdiği için float’tır."}]},
{t:"Sabit mi, Değişken mi?",type:"quiz",intro:"Cezeri’nin mekanizmasında bazı değerler hep aynı kalır (sabit), bazıları çalışırken değişir (değişken). Python’da sabit için ayrı bir kural yoktur; BÜYÜK_HARFLE yazma geleneği vardır.",
q:[
{c:"PI = 3.14159",p:"Bu bir…",o:["Değişken","Sabit"],a:1,e:"Değeri hiç değişmez, büyük harfle yazılmış → sabit."},
{c:"disli_donus = 0\ndisli_donus = disli_donus + 1",p:"disli_donus bir…",o:["Değişken","Sabit"],a:0,e:"Çark döndükçe değeri artıyor → değişken."},
{c:"SU_LIMITI = 100",p:"Su deposunun en fazla 100 litre olması…",o:["Değişken","Sabit"],a:1,e:"Mekanizmanın sınırı değişmiyor → sabit."},
{c:"pil_yuzdesi = 87",p:"Pil yüzdesi zamanla azalır, yani…",o:["Değişken","Sabit"],a:0,e:"Değeri değişiyor → değişken."},
{c:"HAFTA_GUN = 7",p:"Bir haftadaki gün sayısı…",o:["Değişken","Sabit"],a:1,e:"Hiç değişmez → sabit."},
{c:"skor = 0",p:"Oyundaki skor…",o:["Değişken","Sabit"],a:0,e:"Oyun boyunca artar → değişken."}]}
];
function setScore(n){score+=n;document.getElementById("score").textContent="Puan: "+score}
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function render(){
  document.getElementById("prog").style.width=(stage/stages.length*100)+"%";
  app.textContent="";
  if(stage>=stages.length)return done();
  var s=stages[stage];
  if(s.type==="lab")lab();else{qi=0;streak=0;intro(s)}
}
function intro(s){
  var c=el("div",null,"card");
  c.appendChild(el("h2","Bölüm "+(stage+1)+": "+s.t));
  c.appendChild(el("p",s.intro,"mu"));
  var b=el("button","Başla ▶","pri");b.onclick=question;c.appendChild(b);app.appendChild(c);
}
function question(){
  app.textContent="";
  var s=stages[stage],q=s.q[qi];
  var c=el("div",null,"card");
  c.appendChild(el("div","Bölüm "+(stage+1)+": "+s.t+" · Soru "+(qi+1)+"/"+s.q.length,"mu"));
  c.appendChild(el("pre",q.c));
  c.appendChild(el("h2",q.p));
  var o=el("div",null,"opts"),fb=el("div"),locked=false;
  q.o.forEach(function(t,i){
    var b=el("button",t);
    b.onclick=function(){
      if(locked)return;locked=true;
      var ok=i===q.a;
      b.classList.add(ok?"ok":"no");
      if(!ok)o.children[q.a].classList.add("ok");
      if(ok){streak++;setScore(10+(streak>2?5:0))}else streak=0;
      fb.className="fb "+(ok?"ok":"no");
      fb.textContent=(ok?"✅ Doğru! ":"❌ Olmadı. ")+q.e+(ok&&streak>2?" 🔥 Seri bonusu +5":"");
      var n=el("button",qi+1<s.q.length?"Sonraki ▶":"Bölümü bitir ▶","pri");
      n.style.marginTop="10px";
      n.onclick=function(){qi++;if(qi<s.q.length)question();else{stage++;render()}};
      c.appendChild(n);
    };
    o.appendChild(b);
  });
  c.appendChild(o);c.appendChild(fb);app.appendChild(c);
}
function detect(v){
  v=v.trim();
  if(v==="True"||v==="False")return{t:"bool",c:v,s:v};
  if(/^-?\d+$/.test(v))return{t:"int",c:v,s:v};
  if(/^-?\d*\.\d+$/.test(v))return{t:"float",c:v,s:v};
  return{t:"str",c:"\""+v+"\"",s:v};
}
function lab(){
  vars={};var names=["ad","yas","boy","ogrenci_mi"];
  var hints={ad:"Ali",yas:"15",boy:"1.70",ogrenci_mi:"True"};
  var c=el("div",null,"card");
  c.appendChild(el("h2","Bölüm 1: Değişken = Etiketli Kutu 📦"));
  c.appendChild(el("p","Değişken, bellekte değer saklayan adlandırılmış bir kutudur. = işareti “eşittir” değil, “kutuya koy” demektir. Dört kutuyu doldur; istersen aynı kutuya yeni değer koyup eskisinin silindiğini gör.","mu"));
  var row=el("div",null,"row"),sel=el("select"),inp=el("input");
  names.forEach(function(n){var op=el("option",n);op.value=n;sel.appendChild(op)});
  inp.placeholder="değer yaz";inp.value=hints.ad;inp.size=12;
  sel.onchange=function(){inp.value=hints[sel.value]};
  var go=el("button","Kutuya koy","pri");
  row.appendChild(sel);row.appendChild(el("b","="));row.appendChild(inp);row.appendChild(go);c.appendChild(row);
  c.appendChild(el("p","İpucu: Sayıyı olduğu gibi, True/False yaz; başka her şey metin olur.","mu"));
  var boxes=el("div",null,"boxes"),log=el("pre",null,"log"),msg=el("div","","mu"),nx=el("button","Bölüm 2’ye geç ▶","pri");
  nx.disabled=true;
  log.textContent="# Yorumlayıcı satırları sırayla çalıştırır:\n";
  function draw(){
    boxes.textContent="";
    names.forEach(function(n){
      var b=el("div",null,"box"+(vars[n]?" full":""));
      b.appendChild(el("b",n));
      if(vars[n]){b.appendChild(el("div",vars[n].s,"v"));b.appendChild(el("span",vars[n].t,"tag"))}
      else b.appendChild(el("div","(boş)","mu"));
      boxes.appendChild(b);
    });
  }
  go.onclick=function(){
    var n=sel.value,old=vars[n],d=detect(inp.value);
    if(!inp.value.trim()){msg.textContent="Önce bir değer yaz.";return}
    vars[n]=d;
    log.textContent+=n+" = "+d.c+"\n";log.scrollTop=log.scrollHeight;
    msg.textContent=old?"♻️ "+n+" kutusundaki eski değer ("+old.s+") silindi, yerine "+d.s+" geldi.":"✅ "+n+" kutusuna "+d.s+" kondu. Türü: "+d.t;
    if(!old)setScore(5);
    draw();
    if(names.every(function(k){return vars[k]}))nx.disabled=false;
  };
  nx.onclick=function(){stage++;render()};
  c.appendChild(boxes);c.appendChild(msg);c.appendChild(log);c.appendChild(nx);
  app.appendChild(c);draw();
}
function done(){
  document.getElementById("prog").style.width="100%";
  var c=el("div",null,"card");
  var max=4*0+ (8+8+6+6)*10, pct=score/max, st=pct>.8?3:pct>.5?2:1;
  c.appendChild(el("div",["","⭐","⭐⭐","⭐⭐⭐"][st],"big"));
  c.appendChild(el("h2","Atölye tamamlandı! Puanın: "+score));
  c.appendChild(el("p","Bugün öğrendiklerin: değişken adlandırılmış bir kutudur; = ile değer konur; değer türleri int, float, str, bool’dur; sabitler değişmeyen değerlerdir ve büyük harfle yazılır.","mu"));
  c.appendChild(el("pre","ad = \"Cezeri\"\nyuzyil = 12\nprint(ad, yuzyil + \". yüzyılda yaşadı\")"));
  var b=el("button","Yeniden oyna 🔁","pri");
  b.onclick=function(){stage=0;score=0;setScore(0);render()};
  c.appendChild(b);app.appendChild(c);
}
render();
</script>
</body>
</html>
