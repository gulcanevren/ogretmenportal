<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SÖZDE KODU ÇÖZ! – Çeşitli Örnekler</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--acc:#38bdf8;--ok:#22c55e;--bad:#ef4444;--warn:#facc15;--code:#0b1220;--bd:#334155;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e0f2fe;--card:#fff;--tx:#0f172a;--mut:#475569;--code:#0f172a;--bd:#cbd5e1}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:20px;min-height:100vh}
#app{max-width:900px;margin:0 auto;padding:14px}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-weight:700}
.bar{flex:1;min-width:120px;height:16px;background:var(--card);border-radius:9px;overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);transition:width .5s}
.pt{background:var(--warn);color:#0f172a;padding:6px 16px;border-radius:20px}
.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.3)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.card{background:var(--card);border-radius:20px;padding:22px;border:1px solid var(--bd)}
h1{font-size:2.6rem;margin:.2em 0;color:var(--acc);font-family:Consolas,monospace}
h2{margin:.2em 0 .5em;color:var(--acc)}
.c{text-align:center}
.btn{display:block;margin:16px auto 0;font-size:1.4rem;font-weight:800;padding:18px 36px;border:0;border-radius:16px;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;cursor:pointer;min-height:64px}
.btn:active{transform:scale(.97)}
.big{font-size:1.5rem}
.chip{display:inline-block;background:#6366f1;color:#fff;border-radius:14px;padding:3px 14px;font-size:.85rem;font-weight:700;vertical-align:middle}
.pr{background:var(--code);color:#e2e8f0;padding:12px 16px;border-radius:12px;border-left:6px solid var(--acc)}
.code{background:var(--code);color:#e2e8f0;border-radius:14px;padding:10px;font-family:Consolas,monospace;font-size:1.2rem}
.ln{padding:8px 12px;border-radius:8px;display:flex;justify-content:space-between;gap:8px;align-items:center;opacity:.55}
.ln.on{background:#2563eb;opacity:1;font-weight:700}
.tag{font-size:.7rem;padding:2px 10px;border-radius:10px;background:var(--warn);color:#0f172a;font-family:system-ui}
.tag.Girdi{background:#34d399}.tag.İşlem{background:#fb923c}.tag.Çıktı{background:#f472b6}
.vars{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.v{flex:1;min-width:120px;text-align:center;background:var(--code);border:3px solid var(--acc);border-radius:14px;padding:10px;color:#e2e8f0;font-family:Consolas,monospace;font-size:1.4rem}
.v b{display:block;font-size:2.2rem;color:var(--warn)}
#list{list-style:none;padding:0;margin:12px 0}
#list li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--code);color:#e2e8f0;border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;font-family:Consolas,monospace;font-size:1.15rem;cursor:grab}
#list li.ok{border-color:var(--ok);background:#14532d}#list li.no{border-color:var(--bad);background:#7f1d1d;animation:shake .4s}
.mv{font-size:1.2rem;width:48px;height:48px;border-radius:10px;border:0;background:#475569;color:#fff;margin-left:4px;cursor:pointer}
.fb{margin-top:12px;border-radius:12px;font-weight:600}
.fb.ok,.fb.bad{padding:14px;animation:pop .5s}
.fb.ok{background:#14532d;color:#dcfce7}.fb.bad{background:#7f1d1d;color:#fee2e2}
.fb div{margin:6px 0}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:1.05rem}
th,td{border:1px solid var(--bd);padding:6px;text-align:center}
th{background:var(--code);color:#e2e8f0}
td.l{text-align:left;font-family:Consolas,monospace}
input{width:80px;font-size:1.3rem;text-align:center;padding:8px;border-radius:8px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
input.ok{border-color:var(--ok);background:#14532d;color:#fff}input.no{border-color:var(--bad);background:#7f1d1d;color:#fff}
small.a{display:block;color:var(--ok);font-weight:700}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.ops div{background:var(--code);color:#e2e8f0;border-radius:12px;padding:10px;font-family:Consolas,monospace}
.ops b{color:var(--warn);font-size:1.5rem}
.tf{display:flex;gap:12px;flex-wrap:wrap}.tf .btn{flex:1;margin:0;min-width:130px}
.t{background:linear-gradient(135deg,#22c55e,#16a34a)}.f{background:linear-gradient(135deg,#f87171,#dc2626)}.o{background:linear-gradient(135deg,#fb923c,#ea580c)}
.q{font-size:2.6rem;text-align:center;font-family:Consolas,monospace;margin:12px 0;color:var(--warn)}
@media(max-width:600px){body{font-size:17px}h1{font-size:1.9rem}.btn{padding:14px 20px}.q{font-size:1.8rem}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)],shuf=a=>[...a].sort(()=>Math.random()-.5);
const esc=s=>String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');
let score=0,sec=0,G;const MAX=190;

/* ALGORİTMA HAVUZU */
const ALGS=[
{n:'Toplam',p:'Kullanıcının girdiği iki sayının toplamını bul ve sonucu ekrana yazdır.',i:['S1','S2'],lab:['Birinci sayıyı','İkinci sayıyı'],r:'Toplam',f:'S1 + S2',g:()=>[rnd(5,60),rnd(5,60)],fn:(a,b)=>a+b},
{n:'Fark',p:'Kullanıcının girdiği iki sayının farkını bul (büyük − küçük) ve sonucu ekrana yazdır.',i:['S1','S2'],lab:['Büyük sayıyı','Küçük sayıyı'],r:'Fark',f:'S1 - S2',g:()=>{const b=rnd(5,40);return[b+rnd(1,50),b]},fn:(a,b)=>a-b},
{n:'Çarpım',p:'Kullanıcının girdiği iki sayının çarpımını bul ve sonucu ekrana yazdır.',i:['S1','S2'],lab:['Birinci sayıyı','İkinci sayıyı'],r:'Çarpım',f:'S1 * S2',g:()=>[rnd(2,12),rnd(2,12)],fn:(a,b)=>a*b},
{n:'Dikdörtgen Alanı',p:'Kullanıcının girdiği kısa ve uzun kenardan dikdörtgenin alanını bul ve ekrana yazdır.',i:['K1','K2'],lab:['Kısa kenarı','Uzun kenarı'],r:'Alan',f:'K1 * K2',g:()=>[rnd(2,9),rnd(5,15)],fn:(a,b)=>a*b},
{n:'Not Ortalaması',p:'Kullanıcının girdiği iki sınav notunun ortalamasını bul ve ekrana yazdır.',i:['N1','N2'],lab:['Birinci notu','İkinci notu'],r:'Ortalama',f:'(N1 + N2) / 2',g:()=>[rnd(5,10)*10,rnd(5,10)*10],fn:(a,b)=>(a+b)/2},
{n:'Bölme',p:'Kullanıcının girdiği iki sayının bölümünü bul ve sonucu ekrana yazdır.',i:['S1','S2'],lab:['Bölünen sayıyı','Bölen sayıyı'],r:'Bölüm',f:'S1 / S2',g:()=>{const b=rnd(2,9);return[b*rnd(2,12),b]},fn:(a,b)=>a/b}
];
const mk=A=>{const v=A.g();return{A,v,r:A.fn(...v)}};
const lines=A=>[['BAŞLA',''],[`${A.i[0]} değerini oku.`,'Girdi'],[`${A.i[1]} değerini oku.`,'Girdi'],[`${A.r} = ${A.f}`,'İşlem'],[`${A.r} değerini yazdır.`,'Çıktı'],['DUR','']];
const states=({v:[a,b],r})=>[['?','?','?'],[a,'?','?'],[a,b,'?'],[a,b,r],[a,b,r],[a,b,r]];

/* EKRAN YARDIMCILARI */
function show(n,html){
  sec=n;
  const h=n?`<div class="hud"><div>Bölüm ${Math.min(n,4)} / 4</div><div class="bar"><i style="width:${n>4?100:(n-1)/4*100}%"></i></div><div class="pt" id="pt">PUAN: ${score}</div></div>`:'';
  app.innerHTML=h+`<div class="card">${html}</div>`;window.scrollTo(0,0);
}
function add(n){score+=n;const p=$('#pt');if(p){p.textContent='PUAN: '+score;p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');}}
function fb(ok,msg){const f=$('#fb');f.className='fb '+(ok?'ok':'bad');f.innerHTML=msg;}
function nextBtn(label,fn){const b=$('#go');b.textContent=label;b.onclick=fn;}

/* BAŞLANGIÇ */
function start(){
  score=0;const s=shuf(ALGS);G={a1:s[0],s2:mk(s[1]),s3:mk(s[2])};
  show(0,`<div class="c"><div style="font-size:4rem">💻</div><h1>SÖZDE KODU ÇÖZ!</h1>
  <p class="big">Algoritmanın izini sür, değişkenleri takip et ve doğru sonucu bul!</p>
  <p>Bir algoritmanın nasıl çalıştığını keşfetmeye hazır mısın?<br><small style="color:var(--mut)">Her oyunda farklı algoritmalar ve sayılar gelir.</small></p>
  <button class="btn" id="go">OYUNA BAŞLA</button></div>`);
  $('#go').onclick=()=>{
    show(0,`<div class="c"><div style="font-size:3.5rem">⚙️</div><p class="big">Bilgisayar verilen komutları sırayla uygular. Sen de algoritmanın nasıl çalıştığını adım adım takip edeceksin.</p><button class="btn" id="go">BAŞLAYALIM!</button></div>`);
    $('#go').onclick=s1;
  };
}

/* BÖLÜM 1 */
function s1(){
  const A=G.a1,[i0,i1]=A.i;
  const items=[['BAŞLA',1,'Her algoritma BAŞLA ile başlar.'],[`${A.lab[0]} kullanıcıdan al.`,2,'Önce birinci değeri almamız gerekir.'],[`${A.lab[1]} kullanıcıdan al.`,3,'Birinci değerden sonra ikinci değer alınır.'],[`${A.r} = ${A.f}`,4,`Önce değerleri almamız gerekir. ${i0} ve ${i1} bilinmeden ${A.r} = ${A.f} işlemi yapılamaz.`],[`${A.r} sonucunu ekrana yazdır.`,5,'Sonuç hesaplandıktan sonra ekrana yazdırılır.'],['DUR',6,'DUR, algoritmanın en son adımıdır.']];
  let sh;do{sh=shuf(items)}while(sh.some((x,k)=>x[1]===k+1));
  let tries=0,done=false;
  show(1,`<h2>ALGORİTMAYI SIRALA <span class="chip">${A.n}</span></h2>
  <div class="pr"><b>Problem:</b> ${A.p}</div><p>Adımları sürükleyerek (veya ▲▼ ile) doğru sıraya koy:</p>
  <ul id="list">${sh.map(([t,o,w])=>`<li data-o="${o}" data-w="${w}"><span>${t}</span><span><button class="mv" data-d="-1">▲</button><button class="mv" data-d="1">▼</button></span></li>`).join('')}</ul>
  <div id="fb" class="fb"></div><button class="btn" id="go">KONTROL ET</button>`);
  const list=$('#list');
  if(window.Sortable)new Sortable(list,{animation:150,filter:'.mv',preventOnFilter:false});
  list.onclick=e=>{const b=e.target.closest('.mv');if(!b||done)return;const li=b.closest('li'),d=+b.dataset.d;
    if(d<0&&li.previousElementSibling)list.insertBefore(li,li.previousElementSibling);
    if(d>0&&li.nextElementSibling)list.insertBefore(li.nextElementSibling,li);};
  $('#go').onclick=()=>{
    const bad=[];[...list.children].forEach((li,k)=>{const ok=+li.dataset.o===k+1;li.className=ok?'ok':'no';if(!ok)bad.push(li)});
    if(!bad.length){done=true;const p=tries?5:10;add(p+20);fb(true,`🎉 Harika! Algoritmayı doğru sıraladın. +${p} puan, bölüm bonusu +20!`);nextBtn('SONRAKİ BÖLÜM ▶',s2);}
    else{tries++;fb(false,`💡 Tekrar düşün! ${bad.length} adım yanlış yerde:`+bad.map(li=>`<div>❌ <b>${li.firstChild.textContent}</b>: ${li.dataset.w}</div>`).join(''));}
  };
}

/* BÖLÜM 2 */
function s2(){
  const {A,v,r}=G.s2,L=lines(A),V=states(G.s2),[i0,i1]=A.i;
  const sub=A.f.replace(/[A-Z]\d/g,m=>m===i0?v[0]:v[1]);
  const N=['Algoritma başladı. Henüz hiçbir değişkenin değeri yok.',`Girdi: ${i0} değişkenine ${v[0]} yüklendi.`,`Girdi: ${i1} değişkenine ${v[1]} yüklendi.`,`İşlem: ${sub} = ${r}. Sonuç ${A.r} değişkenine yazıldı.`,`Çıktı: Ekrana ${r} yazdırıldı.`,'Algoritma bitti.'];
  let i=0;
  show(2,`<h2>DEĞİŞKENLERİ TAKİP ET <span class="chip">${A.n}</span></h2>
  <p>Örnek girdi: <b>${i0} = ${v[0]}</b>, <b>${i1} = ${v[1]}</b>. Satır satır ilerle ve değişkenlere bak.</p>
  <div class="code" id="cd"></div><div class="vars" id="vs"></div><div id="fb" class="fb"></div><button class="btn" id="go"></button>`);
  const draw=()=>{
    $('#cd').innerHTML=L.map((l,k)=>`<div class="ln ${k===i?'on':''}"><span>${k+1}. ${l[0]}</span>${l[1]?`<span class="tag ${l[1]}">${l[1]}</span>`:''}</div>`).join('');
    $('#vs').innerHTML=[i0,i1,A.r].map((n,k)=>`<div class="v">${n}<b>${V[i][k]}</b></div>`).join('');
    fb(true,(i===4?'📤 ':'👉 ')+N[i]);
    const b=$('#go');
    if(i<5){b.textContent='SONRAKİ ADIM ▶';b.onclick=()=>{i++;draw()};}
    else{b.textContent='BÖLÜMÜ BİTİR (+10 +20 bonus)';b.onclick=()=>{add(30);s3()};}
  };draw();
}

/* BÖLÜM 3 */
const nrm=v=>{v=v.trim().replace(',','.');return(v==='?'||v==='–')?'-':v};
function s3(){
  const {A,v,r}=G.s3,[i0,i1]=A.i,[a,b]=v;
  const OPS=['BAŞLA',`${i0} değerini oku`,`${i1} değerini oku`,`${A.r} = ${A.f}`,`${A.r} değerini yazdır`,'DUR'];
  const ANS=states(G.s3).map(x=>x.map(String).map(y=>y==='?'?'-':y));
  show(3,`<h2>ELLE ÇALIŞTIRMA TABLOSU <span class="chip">${A.n}</span></h2>
  <p><b>${i0} = ${a}</b>, <b>${i1} = ${b}</b> olsun. Her adımdan sonra değişkenlerin değerini yaz. Henüz değer atanmadıysa <b>-</b> yaz.</p>
  <div class="wrap"><table><tr><th>Adım</th><th>İşlem</th><th>${i0}</th><th>${i1}</th><th>${A.r}</th></tr>
  ${OPS.map((o,k)=>`<tr><td>${k+1}</td><td class="l">${o}</td>${[0,1,2].map(c=>`<td><input data-r="${k}" data-c="${c}" placeholder="?" maxlength="5" autocomplete="off"></td>`).join('')}</tr>`).join('')}</table></div>
  <div id="fb" class="fb"></div><button class="btn" id="go">CEVAPLARI GÖNDER</button>`);
  $('#go').onclick=()=>{
    const ins=[...document.querySelectorAll('input')];
    if(ins.some(x=>!x.value.trim())){fb(false,'💡 Boş hücre kalmasın! Değeri henüz bilinmeyen değişken için - yaz.');return}
    let pts=0;
    for(let k=0;k<6;k++){let ok=true;
      ins.filter(x=>+x.dataset.r===k).forEach(x=>{const an=ANS[k][x.dataset.c],good=nrm(x.value)===an;x.className=good?'ok':'no';x.disabled=true;if(!good){ok=false;x.insertAdjacentHTML('afterend',`<small class="a">${an}</small>`)}});
      if(ok)pts+=5;}
    add(pts+20);
    fb(pts===30,pts===30?`🎉 Harika! Tablonun tamamı doğru. +${pts} puan, bonus +20!`:`💡 ${pts/5} / 6 satır doğru (+${pts} puan, bonus +20). Yeşil yazılar doğru değerlerdir. Bir değişken, değer atanana kadar "-" kalır ve atanan değer sonraki adımlarda korunur.`);
    nextBtn('SONRAKİ BÖLÜM ▶',s4);
  };
}

/* BÖLÜM 4 */
const DESC={'=':'Eşittir: iki değer aynı mı?','>':'Büyüktür: soldaki sağdakinden büyük mü?','<':'Küçüktür: soldaki sağdakinden küçük mü?','>=':'Büyük veya eşittir: soldaki sağdakinden büyük ya da ona eşit mi?','<=':'Küçük veya eşittir: soldaki sağdakinden küçük ya da ona eşit mi?','!=':'Eşit değildir: iki değer farklı mı?'};
const cmp=(a,o,b)=>({'<':a<b,'>':a>b,'=':a===b,'!=':a!==b,'<=':a<=b,'>=':a>=b})[o];
function s4(){
  show(4,`<h2>DOĞRU MU YANLIŞ MI?</h2>
  <div class="pr">Karşılaştırma işlemlerinin sonucu sadece iki değer olabilir: <b>DOĞRU (True)</b> veya <b>YANLIŞ (False)</b>.</div>
  <div class="ops">${Object.keys(DESC).map(o=>`<div><b>${esc(o)}</b><br>${DESC[o].split(':')[0]}</div>`).join('')}</div>
  <button class="btn" id="go">SORULARA GEÇ</button>`);
  $('#go').onclick=()=>{
    const ops=shuf(Object.keys(DESC)),Q=[];
    const mkc=(e,o,x,y,vals)=>({kind:'tf',expr:`${e}`,vals,x,o,y});
    const s3=G.s3,[n0,n1]=s3.A.i,[a,b]=s3.v;
    Q.push({kind:'tf',expr:`${n0} ${esc(ops[0])} ${n1}`,vals:`${n0} = ${a}, ${n1} = ${b}`,x:a,o:ops[0],y:b});
    Q.push({kind:'tf',expr:`${s3.A.r} ${esc(ops[1])} ${n0}`,vals:`${s3.A.r} = ${s3.r}, ${n0} = ${a}`,x:s3.r,o:ops[1],y:a});
    for(let k=2;k<4;k++){const x=rnd(1,100);let y=rnd(1,100);if(Math.random()<.35)y=x;Q.push({kind:'tf',expr:`S1 ${esc(ops[k])} S2`,vals:`S1 = ${x}, S2 = ${y}`,x,o:ops[k],y});}
    const A2=G.s2.A,L=lines(A2),types=shuf(['Girdi','İşlem','Çıktı']).slice(0,2),idx={Girdi:pick([1,2]),İşlem:3,Çıktı:4};
    types.forEach(t=>Q.push({kind:'cl',line:L[idx[t]][0],t}));
    ask(Q,0);
  };
}
const WHYC={Girdi:'Girdi: kullanıcıdan veri alan (oku) satırdır.',İşlem:'İşlem: hesaplama yapıp değişkene değer atayan satırdır.',Çıktı:'Çıktı: sonucu ekrana yazdıran satırdır.'};
function ask(Q,i){
  const q=Q[i];let opts,ans,why,body;
  if(q.kind==='tf'){
    ans=cmp(q.x,q.o,q.y)?'DOĞRU':'YANLIŞ';opts=[['DOĞRU','t'],['YANLIŞ','f']];
    body=`<p class="c">${q.vals}</p><div class="q">${q.expr}</div>`;
    why=`${q.x} ${esc(q.o)} ${q.y} ifadesinin sonucu ${ans}. ${DESC[q.o]}`;
  }else{
    ans=q.t;opts=[['Girdi','t'],['İşlem','o'],['Çıktı','f']];
    body=`<p class="c">Aşağıdaki sözde kod satırı hangi bölüme aittir?</p><div class="q" style="font-size:1.7rem">${q.line}</div>`;
    why=WHYC[q.t];
  }
  show(4,`<h2>SORU ${i+1} / ${Q.length}</h2>${body}<div class="tf">${opts.map(([t,c])=>`<button class="btn ${c}">${t}</button>`).join('')}</div>
  <div id="fb" class="fb"></div><button class="btn" id="go" style="display:none"></button>`);
  document.querySelectorAll('.tf .btn').forEach(bt=>bt.onclick=()=>{
    const good=bt.textContent===ans;document.querySelectorAll('.tf .btn').forEach(x=>x.disabled=true);
    if(good)add(10);
    fb(good,good?`🎉 Harika! ${why} +10 puan`:`💡 Tekrar düşün! ${why}`);
    const g=$('#go');g.style.display='block';
    if(i<Q.length-1){g.textContent='SONRAKİ SORU ▶';g.onclick=()=>ask(Q,i+1)}
    else{add(20);g.textContent='SONUCU GÖR 🏆 (+20 bonus)';g.onclick=result}
  });
}

/* SONUÇ */
function result(){
  const p=score/MAX*100;
